<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkNote Admin Center V3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #020617; color: #e2e8f0; }
        .sidebar { width: 300px; background: #0b1120; border-right: 1px solid #1e293b; padding: 24px; height: 100vh; display: flex; flex-direction: column; }
        .main-content { flex: 1; padding: 40px; overflow-y: auto; height: 100vh; }

        .stat-card { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; margin-bottom: 20px; }
        .stat-val { font-size: 32px; font-weight: 900; color: white; }
        .stat-label { font-size: 12px; color: #94a3b8; }

        .request-card { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 24px; margin-bottom: 20px; display: flex; gap: 20px; transition: 0.2s; }
        .request-card:hover { border-color: #60a5fa; }
        
        .ai-analysis { background: rgba(59, 130, 246, 0.05); border-left: 3px solid #3b82f6; padding: 12px; border-radius: 0 8px 8px 0; margin-top: 12px; font-size: 13px; color: #bfdbfe; }

        /* Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(4px); }
        .modal-content { background: #1e293b; width: 600px; padding: 30px; border-radius: 20px; border: 1px solid #334155; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    </style>
</head>
<body class="flex">

    <aside class="sidebar">
        <h1 class="text-xl font-black text-white mb-8 flex items-center gap-2">
            <span class="material-symbols-rounded text-red-500">admin_panel_settings</span> Admin Center
        </h1>
        
        <div class="stat-card">
            <div class="stat-val text-blue-400" id="count-pending">0</div>
            <div class="stat-label">승인 대기 (Pending)</div>
        </div>
        <div class="stat-card border-green-500/30 bg-green-500/5">
            <div class="stat-val text-green-400" id="count-approved">0</div>
            <div class="stat-label">승인됨 (Approved)</div>
        </div>

        <div class="mt-auto">
            <button onclick="openPromptModal()" class="w-full py-4 bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-500 hover:to-blue-500 text-white font-bold rounded-xl shadow-lg shadow-purple-900/20 flex items-center justify-center gap-2 transition group">
                <span class="material-symbols-rounded group-hover:animate-spin">smart_toy</span>
                AI 프롬프트 생성
            </button>
            <p class="text-[10px] text-slate-500 text-center mt-3">승인된 항목을 코드로 변환 요청합니다.</p>
        </div>
    </aside>

    <main class="main-content">
        <h2 class="text-2xl font-bold text-white mb-6 flex items-center gap-2">
            <span class="material-symbols-rounded text-yellow-500">inbox</span> 요청 피드 (Request Feed)
        </h2>
        <div id="request-feed"></div>
    </main>

    <div class="modal-overlay" id="prompt-modal">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-white">🤖 AI 개발자에게 보낼 프롬프트</h3>
                <button onclick="closePromptModal()" class="text-slate-400 hover:text-white"><span class="material-symbols-rounded">close</span></button>
            </div>
            <textarea id="prompt-area" class="w-full h-60 bg-[#020617] text-green-400 font-mono text-sm p-4 rounded-xl border border-slate-700 outline-none resize-none mb-4" readonly></textarea>
            <button onclick="copyPrompt()" class="w-full py-3 bg-green-600 hover:bg-green-500 text-white font-bold rounded-lg transition">📋 프롬프트 복사하기</button>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('wn_system_db') || "[]");

        function renderAdmin() {
            const feed = document.getElementById('request-feed');
            const pendingItems = db.filter(i => i.status === 'pending').sort((a,b) => b.id - a.id);
            
            document.getElementById('count-pending').innerText = pendingItems.length;
            document.getElementById('count-approved').innerText = db.filter(i => i.status === 'approved').length;

            if(pendingItems.length === 0) {
                feed.innerHTML = `<div class="text-center text-slate-500 py-20 bg-slate-900/50 rounded-xl border border-slate-800">대기 중인 요청이 없습니다.</div>`;
                return;
            }

            feed.innerHTML = pendingItems.map(item => `
                <div class="request-card">
                    <div class="flex-1">
                        <div class="flex items-center gap-3 mb-2">
                            <span class="px-2 py-1 rounded bg-slate-800 text-xs font-bold text-slate-400 uppercase border border-slate-700">${item.section}</span>
                            <span class="text-xs text-slate-500">${item.timestamp}</span>
                        </div>
                        <p class="text-white text-lg font-medium leading-relaxed">"${item.content}"</p>
                        <div class="ai-analysis"><strong>🤖 AI 분석:</strong> ${getAiAnalysis(item.section)}</div>
                    </div>
                    <div class="flex flex-col gap-2 justify-center border-l border-slate-700 pl-6">
                        <button onclick="updateStatus(${item.id}, 'approved')" class="px-4 py-2 bg-green-600 hover:bg-green-500 text-white rounded-lg font-bold text-sm">승인</button>
                        <button onclick="updateStatus(${item.id}, 'rejected')" class="px-4 py-2 bg-slate-700 hover:bg-red-600 text-white rounded-lg font-bold text-sm">거절</button>
                    </div>
                </div>
            `).join('');
        }

        function getAiAnalysis(section) {
            if(section === 'ui') return "디자인/UX 개선 요청입니다. UI 파일(Tabs) 수정이 필요합니다.";
            if(section === 'overview') return "구조 변경이 필요하므로 '주요 업데이트'로 분류됩니다.";
            if(section === 'dataflow') return "데이터 무결성을 위해 충돌 방지 로직 설계가 선행되어야 합니다.";
            if(section === 'login') return "사용자 경험(UX) 개선 사항입니다. AuthProvider 수정 필요.";
            return "보안/에러 관련 이슈입니다. 즉시 해결 권장.";
        }

        function updateStatus(id, status) {
            const item = db.find(i => i.id === id);
            if(item) { item.status = status; localStorage.setItem('wn_system_db', JSON.stringify(db)); renderAdmin(); }
        }

        function openPromptModal() {
            const approved = db.filter(i => i.status === 'approved');
            if(approved.length === 0) return alert("승인된 항목이 없습니다.");
            const modal = document.getElementById('prompt-modal');
            const area = document.getElementById('prompt-area');
            let promptText = "👨‍💻 **[관리자 승인 완료] 개선 요청**\n\n";
            approved.forEach((item, index) => { promptText += `${index + 1}. [${item.section.toUpperCase()}] "${item.content}"\n`; });
            promptText += "\n🚀 위 내용을 반영하여 코드를 수정해주세요.";
            area.value = promptText;
            modal.style.display = 'flex';
        }

        function closePromptModal() { document.getElementById('prompt-modal').style.display = 'none'; }
        function copyPrompt() { document.getElementById('prompt-area').select(); document.execCommand('copy'); alert("복사완료!"); closePromptModal(); }
        setInterval(() => { db = JSON.parse(localStorage.getItem('wn_system_db') || "[]"); renderAdmin(); }, 1000);
        window.onload = renderAdmin;
    </script>
</body>
</html>
