name: worknote
description: "WorkNote Master Integrated Version"
publish_to: 'none'
version: 3.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # [Core & UI]
  provider: ^6.1.2
  intl: any
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.8
  flutter_staggered_grid_view: ^0.7.0 
  table_calendar: ^3.1.2

  # [Features]
  image_picker: ^1.0.7
  path_provider: ^2.1.2
  fl_chart: ^0.66.0
  url_launcher: ^6.2.5
  uuid: ^4.3.3

  # [Backend & Sync]
  google_sign_in: ^6.1.0
  googleapis: ^11.0.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.7
  http: ^1.1.0
  collection: ^1.18.0
  
  # [DB]
  hive_flutter: ^1.1.0
  hive: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
